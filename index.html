<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B5E42" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="墨记">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<script>
(() => {
  const root=document.documentElement;
  try{
    const config=JSON.parse(localStorage.getItem('mojiCfg')||'null');
    if(config?.theme==='dark')root.setAttribute('data-theme','dark');
    root.dataset.startupLaunch=config?.launchCapture===false?'0':'1';
    const remembered=JSON.parse(localStorage.getItem('mojiKey')||'null');
    if(!remembered||Date.now()>Number(remembered.exp))root.dataset.startupLocked='1';
  }catch(e){
    root.dataset.startupLaunch='1';
    root.dataset.startupLocked='1';
  }
})();
</script>
<title>墨记 · 极简记账</title>
<style>
/* ============ 设计 Token:墨绿极简高级感 ============ */
:root{
  --bg:#FBFBFA;
  --surface:#FFFFFF;
  --surface-muted:#F4F5F3;
  --text:#1A1F1C;
  --text-muted:#6B726D;
  --text-faint:#9AA09B;
  --border:rgba(26,31,28,0.08);
  --border-strong:rgba(26,31,28,0.14);
  --brand:#0B5E42;          /* 墨绿 */
  --brand-strong:#084A34;
  --brand-soft:#E8F1EC;
  --brand-text:#0B5E42;
  --danger:#C0493B;
  --danger-soft:#FBEDEB;
  --warning:#B8860B;
  --up:#C0493B;             /* 支出-红 */
  --down:#0B5E42;           /* 收入-绿 */
  --radius:10px;
  --radius-lg:16px;
  --radius-full:999px;
  --shadow-sm:0 1px 2px rgba(26,31,28,.04),0 1px 3px rgba(26,31,28,.04);
  --shadow-md:0 2px 8px rgba(26,31,28,.05),0 6px 20px rgba(26,31,28,.04);
  --sp-4:4px;--sp-8:8px;--sp-12:12px;--sp-16:16px;--sp-20:20px;--sp-24:24px;--sp-32:32px;
  --font:"SF Pro Text","PingFang SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#121512;
  --surface:#1A1E1A;
  --surface-muted:#22271F;
  --text:#E8EAE6;
  --text-muted:#9BA298;
  --text-faint:#6B726A;
  --border:rgba(232,234,230,0.09);
  --border-strong:rgba(232,234,230,0.16);
  --brand:#2FB488;
  --brand-strong:#45C79A;
  --brand-soft:#15291F;
  --brand-text:#45C79A;
  --danger:#E0695A;
  --danger-soft:#2A1A17;
  --up:#E0695A;
  --down:#2FB488;
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);
  --shadow-md:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:inherit;text-decoration:none}
::selection{background:var(--brand-soft)}

/* ============ 侧边导航 ============ */
.sidebar{
  width:220px;flex-shrink:0;height:100vh;position:sticky;top:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:var(--sp-20) var(--sp-12);
}
.brand{display:flex;align-items:center;gap:var(--sp-12);padding:var(--sp-8) var(--sp-12) var(--sp-24);}
.brand-logo{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px}
.brand-name{font-weight:600;font-size:16px;letter-spacing:.3px}
.brand-sub{font-size:11px;color:var(--text-faint);margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:var(--sp-12);padding:9px var(--sp-12);
  border-radius:var(--radius);color:var(--text-muted);font-size:14px;font-weight:500;
  transition:background .15s,color .15s;
}
.nav-item svg{width:18px;height:18px;stroke-width:1.6}
.nav-item:hover{background:var(--surface-muted);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-text)}
.nav-foot{display:flex;flex-direction:column;gap:2px;padding-top:var(--sp-12);border-top:1px solid var(--border)}
.theme-toggle{display:flex;align-items:center;gap:var(--sp-12);padding:9px var(--sp-12);border-radius:var(--radius);color:var(--text-muted);font-size:14px;font-weight:500;width:100%}
.theme-toggle:hover{background:var(--surface-muted);color:var(--text)}

/* ============ 主区 ============ */
.main{flex:1;min-width:0;height:100vh;overflow-y:auto}
.page{max-width:1080px;margin:0 auto;padding:var(--sp-32) var(--sp-32) 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:var(--sp-24);gap:var(--sp-16);flex-wrap:wrap}
.page-title{font-size:24px;font-weight:600;letter-spacing:.2px}
.page-sub{font-size:13px;color:var(--text-muted);margin-top:2px}

/* ============ 通用组件 ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-20);box-shadow:var(--shadow-sm)}
.card-title{font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:var(--sp-16)}
.grid{display:grid;gap:var(--sp-16)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{
  display:inline-flex;align-items:center;gap:var(--sp-8);padding:9px 16px;border-radius:var(--radius);
  background:var(--brand);color:#fff;font-weight:600;font-size:14px;transition:background .15s,transform .05s;
  box-shadow:var(--shadow-sm)
}
.btn:hover{background:var(--brand-strong)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn svg{width:16px;height:16px;stroke-width:2}
.btn-ghost{background:var(--surface-muted);color:var(--text);box-shadow:none}
.btn-ghost:hover{background:var(--border-strong)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-danger{background:transparent;color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:var(--radius-full);background:var(--surface-muted);color:var(--text-muted);font-size:12px;font-weight:500}
.chip-cat{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill{padding:5px 12px;border-radius:var(--radius-full);background:var(--surface-muted);color:var(--text-muted);font-size:13px;font-weight:500}
.pill.active{background:var(--brand);color:#fff}
.muted{color:var(--text-muted)}
.faint{color:var(--text-faint)}
.right{text-align:right}
.flex{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.wrap{flex-wrap:wrap}

/* KPI */
.kpi-label{font-size:13px;color:var(--text-muted);font-weight:500}
.kpi-value{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.5px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi-delta{font-size:12px;margin-top:6px;font-weight:500}
.kpi-delta.up{color:var(--up)}
.kpi-delta.down{color:var(--down)}

/* 列表 */
.tx-row{display:flex;align-items:center;gap:var(--sp-12);padding:11px 0;border-top:1px solid var(--border)}
.tx-row:first-child{border-top:none}
.tx-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:15px}
.tx-main{flex:1;min-width:0}
.tx-name{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:12px;color:var(--text-faint);margin-top:1px}
.tx-amt{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.exp{color:var(--up)}
.tx-amt.inc{color:var(--down)}

/* 进度条 */
.bar{height:7px;border-radius:var(--radius-full);background:var(--surface-muted);overflow:hidden}
.bar-fill{height:100%;border-radius:var(--radius-full);background:var(--brand);transition:width .4s}
.bar-fill.over{background:var(--danger)}
.budget-category-layout{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center}
.budget-category-chart{width:150px;height:150px;position:relative}
.budget-category-list{min-width:0}
.budget-category-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.budget-category-name{display:flex;align-items:center;gap:7px;min-width:0;font-weight:500}
.budget-category-name span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.budget-category-value{display:flex;align-items:baseline;gap:7px;flex-shrink:0;white-space:nowrap;font-size:13px}
.budget-category-value small{color:var(--text-faint);font-size:12px}

/* 表单 */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--text-muted)}
.input,.select{
  width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);
  background:var(--surface);transition:border-color .15s,box-shadow .15s;outline:none;
}
.input:focus,.select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{resize:vertical;min-height:60px}

/* 模态 */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,12,.4);backdrop-filter:blur(2px);display:none;place-items:center;z-index:70;padding:20px}
.modal-bg.open{display:grid}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);width:100%;max-width:460px;max-height:90vh;overflow-y:auto;padding:var(--sp-24);animation:pop .18s ease}
.modal.wide{max-width:560px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-20)}
.modal-title{font-size:18px;font-weight:600}
/* sticky 底部操作条:内容滚动时主按钮始终钉在弹窗底部 */
.sheet-foot{position:sticky;bottom:calc(-1 * var(--sp-24));margin:var(--sp-16) calc(-1 * var(--sp-24)) calc(-1 * var(--sp-24));padding:var(--sp-16) var(--sp-24);background:var(--surface);border-top:1px solid var(--border)}
.x-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-muted)}
.x-btn:hover{background:var(--surface-muted)}

/* AI 区 */
.drop{
  border:2px dashed var(--border-strong);border-radius:var(--radius-lg);padding:var(--sp-32);text-align:center;
  transition:border-color .15s,background .15s;cursor:pointer;
}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop-icon{width:44px;height:44px;margin:0 auto var(--sp-12);color:var(--brand)}
.ai-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-full);background:var(--brand-soft);color:var(--brand-text);font-size:12px;font-weight:600}
.spinner{width:18px;height:18px;border:2px solid var(--border-strong);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 空态 */
.empty{text-align:center;padding:var(--sp-32);color:var(--text-faint)}
.empty svg{width:40px;height:40px;margin:0 auto var(--sp-12);opacity:.5}

/* toast */
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);background:var(--text);color:var(--bg);padding:10px 12px 10px 18px;border-radius:var(--radius-full);font-size:13px;font-weight:500;box-shadow:var(--shadow-md);opacity:0;transition:.25s;z-index:260;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast.top{top:calc(68px + env(safe-area-inset-top));bottom:auto;transform:translateX(-50%) translateY(-20px)}
#toast.top.show{transform:translateX(-50%) translateY(0)}
#toastMessage{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toastAction{flex-shrink:0;padding:5px 10px;border-radius:var(--radius-full);background:var(--brand);color:#fff;font-size:13px;font-weight:600}
#toastAction[hidden]{display:none}

/* FAB */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-md);z-index:40;transition:transform .12s,background .15s}
.fab:hover{background:var(--brand-strong);transform:scale(1.05)}
.fab:active{transform:scale(.94)}
.fab svg{width:24px;height:24px;stroke-width:2.2}

/* 设置页功能入口 */
.entry-item{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-muted);text-align:left;transition:background .15s}
.entry-item:active{background:var(--border-strong)}
.entry-item svg{width:22px;height:22px;stroke-width:1.7;color:var(--brand-text);margin-bottom:4px}
.entry-item span{font-size:14px;font-weight:600;color:var(--text)}
.entry-item small{font-size:11px;color:var(--text-faint)}

/* 开屏记账全屏页 */
.launch{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 20px calc(env(safe-area-inset-bottom) + 18px)}
.launch.open,html[data-startup-launch="1"]:not([data-startup-locked="1"]):not([data-booted="1"]) .launch{display:flex}
.launch-head{display:flex;align-items:center;justify-content:space-between;height:48px;flex-shrink:0}
.launch-brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.launch-mark{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px}
.launch-exit{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-muted);color:var(--text-muted)}
.launch-exit svg{width:20px;height:20px}
.launch-exit:active{background:var(--border-strong)}
.launch-mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto;padding:12px 0}
.launch-eyebrow{font-size:12px;font-weight:600;letter-spacing:2px;color:var(--brand-text);margin-bottom:10px}
.launch-title{font-size:30px;font-weight:700;letter-spacing:.3px;line-height:1.25}
.launch-sub{font-size:15px;color:var(--text-muted);margin-top:8px}
.launch-feedback{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.launch-bottom{flex-shrink:0}
.launch-tip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--danger);margin-bottom:10px}
.launch-tip[hidden]{display:none!important}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.launch-composer{display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:24px;padding:7px 7px 7px 10px;box-shadow:var(--shadow-sm)}
.launch-mic,.launch-send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.launch-mic{background:var(--surface-muted);color:var(--text)}
.launch-mic.rec{background:var(--danger);color:#fff}
.launch-mic svg{width:22px;height:22px}
.launch-send{background:var(--brand);color:#fff}
.launch-send svg{width:21px;height:21px}
.launch-send:active,.launch-mic:active{transform:scale(.92)}
.launch-entry{flex:1;border:none;outline:none;background:transparent;resize:none;font-size:16px;line-height:1.4;max-height:120px;padding:9px 0;color:var(--text)}
.launch-manual{display:block;margin:10px auto 0;padding:6px 12px;color:var(--text-muted);font-size:13px}
.launch-manual:active{color:var(--brand-text)}

/* iOS 底部标签栏(桌面隐藏,移动端显示) */
.tabbar{display:none}

/* 移动端顶栏(默认隐藏,窄屏显示) */
.topbar{display:none}

/* 响应式 */
.menu-btn{display:none}
@media(max-width:860px){
  body{background:var(--surface-muted)}
  .sidebar{display:none}                       /* 移动端用底部标签栏,不用侧边 */
  #appFab{display:none}                         /* 悬浮记账键隐藏,入口移到标签栏中央(模态内的 .fab 麦克风不受影响) */
  /* iOS 大标题顶栏:毛玻璃 + 安全区 */
  .topbar{display:flex;align-items:flex-end;position:fixed;top:0;left:0;right:0;z-index:55;
    height:calc(44px + env(safe-area-inset-top));padding:0 var(--sp-16) 8px;
    padding-top:env(safe-area-inset-top);
    background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--border)}
  .topbar-title{font-size:17px;font-weight:600;letter-spacing:.2px}
  .menu-btn{display:none}
  /* 内容区:顶栏 + 标签栏之间,给大标题留白 */
  .page{padding:calc(44px + env(safe-area-inset-top)) 0 calc(72px + env(safe-area-inset-bottom))}
  .page>*{padding-left:var(--sp-16);padding-right:var(--sp-16)}
  .page>.card,.page>.grid{margin-left:var(--sp-16);margin-right:var(--sp-16);padding-left:var(--sp-20);padding-right:var(--sp-20)}
  /* iOS 大标题:进页面时在内容顶部显示 */
  .page-head{display:block;margin:4px 0 var(--sp-16)}
  .page-head .page-title{display:block;font-size:30px;font-weight:700;letter-spacing:.3px}
  .page-head .page-sub{font-size:14px}
  .page-head .btn{display:none}
  .grid-3,.grid-2{grid-template-columns:1fr}
  /* 卡片:iOS 分组圆角 + 柔和背景 */
  .card{border-radius:14px;border:none;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  [data-theme="dark"] .card{box-shadow:none;background:var(--surface)}
  /* 底部标签栏(iOS TabBar) */
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;
    height:calc(50px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--border)}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--text-faint);font-size:10px;font-weight:500;padding-top:6px;transition:color .15s}
  .tab-item svg{width:24px;height:24px;stroke-width:1.8}
  .tab-item.active{color:var(--brand-text)}
  .tab-item.active svg{stroke-width:2.1}
  /* 中央记账按钮:凸起圆形 */
  .tab-rec{flex:0 0 auto;width:52px;display:flex;align-items:center;justify-content:center}
  .tab-rec button{width:48px;height:48px;border-radius:50%;background:var(--brand);color:#fff;
    display:grid;place-items:center;box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 45%,transparent);
    margin-top:-14px;transition:transform .12s}
  .tab-rec button:active{transform:scale(.92)}
  .tab-rec button svg{width:26px;height:26px;stroke-width:2.4}
  /* 热区与控件放大 */
  .seg button{padding:9px 14px;font-size:14px}
  .pill{padding:8px 14px}

<script async src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" onload="window.dispatchEvent(new Event('moji:chart-ready'))"></script>
<script>
/* ===================== 工具 ===================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function todayISO(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const CUR=()=>cfg.currency||'¥';
function fmt(n){return CUR()+Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtNo(n){return Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function toast(msg,{duration=2200,actionLabel='',onAction=null,position='bottom'}={}){
  const t=$('#toast'),message=$('#toastMessage'),action=$('#toastAction');
  const seq=(t._seq||0)+1;t._seq=seq;
  t.classList.toggle('top',position==='top');
  message.textContent=msg;action.hidden=!actionLabel;action.textContent=actionLabel;action.disabled=false;
  action.onclick=onAction?async()=>{
    if(t._seq!==seq)return;
    action.disabled=true;
    try{
      await onAction();
      if(t._seq===seq)t.classList.remove('show');
    }catch(e){
      toast('操作失败,请重试');
    }
  }:null;
  t.classList.add('show');clearTimeout(t._t);
  t._t=setTimeout(()=>{if(t._seq===seq)t.classList.remove('show');},duration);
}
function monthKey(d){return d.slice(0,7);}
function curMonth(){return todayISO().slice(0,7);}
function escapeHtml(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ===================== 存储层 (IndexedDB) ===================== */
const DB_NAME='mojiDB',DB_VER=2;
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      ['transactions','accounts','categories','budgets','goals','rules','meta'].forEach(s=>{
        if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});
      });
    };
    r.onsuccess=e=>{db=e.target.result;res();};
    r.onerror=e=>rej(e);
  });
}
function txStore(store,mode='readonly'){return db.transaction(store,mode).objectStore(store);}
function dbAll(store){return new Promise(res=>{const o=txStore(store).getAll();o.onsuccess=()=>res(o.result||[]);});}
// dbPut:自动盖 updatedAt 并标记待同步(除非 opts.fromSync,避免回环)
function dbPut(store,v,opts={}){
  if(!opts.fromSync){v.updatedAt=Date.now();v._dirty=1;}
  return new Promise(res=>{const o=txStore(store,'readwrite').put(v);o.onsuccess=()=>{if(!opts.fromSync)queueSync();res(v);};});
}
// dbDel:软删除墓碑(保留记录,标 deleted,供云端同步删除),而非物理删除
function dbDel(store,id,opts={}){
  return new Promise(res=>{
    const os=txStore(store,'readwrite');const g=os.get(id);
    g.onsuccess=()=>{
      const cur=g.result;
      if(opts.hard||!cur){const d=os.delete(id);d.onsuccess=()=>res();return;}
      cur.deleted=1;cur.updatedAt=Date.now();cur._dirty=1;
      const p=os.put(cur);p.onsuccess=()=>{if(!opts.fromSync)queueSync();res();};
    };
  });
}
function dbClear(store){return new Promise(res=>{const o=txStore(store,'readwrite').clear();o.onsuccess=()=>res();});}

/* ===================== 端到端加密(E2EE) =====================
   主密码 → PBKDF2(250k) → AES-GCM-256 钥匙(cryptoKey,只在内存)。
   云端每条记录的 data 字段 = 密文;服务器拿不到明文,也拿不到钥匙。
   盐(salt)存本地 localStorage + 云端 meta/__vault__(便于换设备校验同一密码)。 */
let cryptoKey=null;                        // 内存中的 AES 钥匙,锁定即丢
const te=new TextEncoder(),td=new TextDecoder();
function b64e(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)));}
function b64d(str){return Uint8Array.from(atob(str),c=>c.charCodeAt(0));}
async function deriveKey(pass,saltB64){
  const salt=b64d(saltB64);
  const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);  // extractable:本机记住钥匙需导出
}
async function encField(plainStr){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,te.encode(plainStr));
  return 'v1:'+b64e(iv)+':'+b64e(ct);         // 密文自带版本号+IV,便于识别/升级
}
async function decField(blob){
  if(typeof blob!=='string'||!blob.startsWith('v1:'))return blob; // 兼容未加密旧数据
  const[,ivB,ctB]=blob.split(':');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(ivB)},cryptoKey,b64d(ctB));
  return td.decode(pt);
}

/* ===================== 云同步(本地优先 + last-write-wins) ===================== */
const SYNC_STORES=['transactions','accounts','categories','budgets','goals','rules'];
let syncTimer=null,syncing=false;
function syncMeta(){return JSON.parse(localStorage.getItem('mojiSync')||'{"since":0}');}
function setSyncMeta(m){localStorage.setItem('mojiSync',JSON.stringify(m));}
function queueSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1200);} // 写入后防抖同步
function setSyncStatus(s){const el=$('#syncDot');if(el){el.dataset.state=s;el.title={idle:'已同步',syncing:'同步中…',offline:'离线(仅本地)',error:'同步失败'}[s]||'';}}
// 收集所有 _dirty 记录(E2EE:业务 store 的 data 上传前加密;meta 存盐,明文)
const PUSH_STORES=['transactions','accounts','categories','budgets','goals','rules','meta'];
async function collectDirty(){
  const changes=[];
  for(const store of PUSH_STORES){
    const all=await new Promise(r=>{const o=txStore(store).getAll();o.onsuccess=()=>r(o.result||[]);});
    for(const x of all.filter(x=>x._dirty)){
      const{_dirty,...data}=x;
      const plain=JSON.stringify(data);
      const enc=cryptoKey&&store!=='meta';   // meta(盐/校验块)不加密,其余密文
      changes.push({store,id:x.id,data:enc?await encField(plain):plain,updatedAt:x.updatedAt||Date.now(),deleted:x.deleted?1:0});
    }
  }
  return changes;
}
// 清除已成功上行记录的 _dirty 标记
async function clearDirty(changes){
  for(const c of changes){
    await new Promise(r=>{
      const os=txStore(c.store,'readwrite');const g=os.get(c.id);
      g.onsuccess=()=>{const v=g.result;if(v&&v._dirty){delete v._dirty;os.put(v).onsuccess=()=>r();}else r();};
    });
  }
}
// 应用云端下行记录到本地(LWW:云端更新才覆盖;墓碑则删本地。E2EE:data 先解密)
async function applyRemote(records){
  for(const r of records){
    if(!SYNC_STORES.includes(r.store))continue;
    const local=await new Promise(res=>{const o=txStore(r.store).get(r.id);o.onsuccess=()=>res(o.result);});
    const localUpd=local?.updatedAt||0;
    if(r.updatedAt<=localUpd)continue; // 本地更新,保留
    if(r.deleted){if(local)await dbDel(r.store,r.id,{hard:true,fromSync:true});continue;}
    let plain;
    try{plain=cryptoKey?await decField(r.data):r.data;}
    catch(e){continue;} // 解密失败(密码不符/损坏):跳过,不污染本地
    const obj=JSON.parse(plain);obj.updatedAt=r.updatedAt;
    await dbPut(r.store,obj,{fromSync:true});
  }
}
async function syncNow(){
  if(syncing)return;
  if(!navigator.onLine){setSyncStatus('offline');return;}
  syncing=true;setSyncStatus('syncing');
  try{
    const meta=syncMeta();
    const changes=await collectDirty();
    const res=await fetch('/api/sync',{
      method:'POST',headers:{'Content-Type':'application/json','X-Moji-Pass':getPass()},
      body:JSON.stringify({since:meta.since,changes})
    });
    if(res.status===401){lockOut();return;}   // 密码失效:重新锁屏
    if(!res.ok)throw new Error('HTTP '+res.status);
    const out=await res.json();
    await clearDirty(changes);
    await applyRemote(out.records||[]);
    setSyncMeta({since:out.now});
    setSyncStatus('idle');
    if(out.records&&out.records.length){await reload();render();}
  }catch(e){
    setSyncStatus(navigator.onLine?'error':'offline'); // 失败不影响本地使用
  }finally{syncing=false;}
}

/* ===================== 配置 (localStorage) ===================== */
let cfg=JSON.parse(localStorage.getItem('mojiCfg')||'null')||{
  currency:'¥',
  theme:'light',
  apiKey:'',
  apiBase:'https://openrouter.ai/api/v1/chat/completions',
  model:'deepseek/deepseek-v4.1-flash-1017',
  asrModel:'qwen/qwen3-asr-1.7b',
  launchCapture:true           // 打开 app 默认直接进开屏记账页
};
function saveCfg(){localStorage.setItem('mojiCfg',JSON.stringify(cfg));}
if(!cfg.asrModel||['qwen/qwen3.8-omni-flash','qwen/qwen3-asr-0.6b'].includes(cfg.asrModel)){cfg.asrModel='qwen/qwen3-asr-1.7b';saveCfg();} // 迁移旧 ASR
// 一次性迁移：此前版本默认关闭开屏记账，新版本改为默认开启；用户之后仍可在设置中关闭。
if(localStorage.getItem('mojiLaunchDefaultV2')!=='1'){
  cfg.launchCapture=true;saveCfg();localStorage.setItem('mojiLaunchDefaultV2','1');
}

/* ===================== 内存缓存 ===================== */
let DATA={tx:[],accounts:[],categories:[],budgets:[],goals:[],rules:[]};
async function reload(){
  const live=arr=>arr.filter(x=>!x.deleted); // 过滤软删除墓碑
  DATA.tx=live(await dbAll('transactions')).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  DATA.accounts=live(await dbAll('accounts'));
  DATA.categories=live(await dbAll('categories'));
  DATA.budgets=live(await dbAll('budgets'));
  DATA.goals=live(await dbAll('goals'));
  DATA.rules=live(await dbAll('rules'));
}
const catById=id=>DATA.categories.find(c=>c.id===id);
const acctById=id=>DATA.accounts.find(a=>a.id===id);
const defaultAccount=()=>DATA.accounts[0]?.id;  // 单账户:默认入账账户
/* 两级分类辅助:一级(parent=null,带色/图标) + 二级(parent=一级id) */
const topCats=kind=>DATA.categories.filter(c=>!c.parent&&(!kind||c.kind===kind));
const subCats=topId=>DATA.categories.filter(c=>c.parent===topId);
const leafCats=kind=>DATA.categories.filter(c=>c.parent&&(!kind||c.kind===kind));
function topOf(id){const c=catById(id);if(!c)return null;return c.parent?catById(c.parent):c;}
function catColor(id){return topOf(id)?.color||'#888';}
function catIcon(id){return topOf(id)?.icon||'•';}
function catName(id){return catById(id)?.name||'未分类';}            // 二级名
function catFull(id){const c=catById(id);if(!c)return'未分类';const t=c.parent?catById(c.parent):null;return t?t.name+' · '+c.name:c.name;}
function catKind(id){return topOf(id)?.kind||'exp';}

/* ===================== 分类体系(两级) ===================== */
const CAT_TREE={

function monthTx(m=curMonth()){return DATA.tx.filter(t=>monthKey(t.date)===m);}
function sumBy(list,kind){return list.filter(t=>t.kind===kind).reduce((s,t)=>s+t.amount,0);}
function netWorth(){return DATA.accounts.reduce((s,a)=>s+a.balance,0);}

/* 订阅检测:近90天内,同名/相近金额出现≥2次且间隔约1月 */
function detectSubs(){
  const map={};
  DATA.tx.filter(t=>t.kind==='exp').forEach(t=>{
    const key=(t.note||'').trim()+'|'+Math.round(t.amount);
    if(!key.startsWith('|'))(map[key]=map[key]||[]).push(t);
  });
  const subs=[];
  Object.values(map).forEach(arr=>{
    if(arr.length>=2){
      arr.sort((a,b)=>a.date.localeCompare(b.date));
      subs.push({note:arr[0].note,amount:arr[0].amount,count:arr.length,last:arr[arr.length-1].date});
    }
  });
  return subs;
}

function buildInsights(mt,exp,lastExp,catArr){
  const out=[];
  if(catArr[0]){out.push({icon:'📊',text:`最大支出来自 <b>${catArr[0].cat.name}</b>,占本月 ${(catArr[0].v/exp*100).toFixed(0)}%(${fmt(catArr[0].v)})。`});}
  if(lastExp){const d=exp-lastExp;out.push({icon:d>0?'⚠️':'✅',text:d>0?`本月支出比上月多 <b style="color:var(--up)">${fmt(d)}</b>,注意节奏。`:`本月支出比上月少 <b style="color:var(--down)">${fmt(-d)}</b>,保持得不错。`});}
  // 月总预算预警
  const monthBudget=DATA.budgets.find(b=>b.month===curMonth()&&b.scope==='month');
  if(monthBudget&&exp/monthBudget.limit>=.8){out.push({icon:'🔔',text:`本月预算已用 <b>${(exp/monthBudget.limit*100).toFixed(0)}%</b>,${exp>monthBudget.limit?'已经超支。':'接近上限。'}`});}
  const subs=detectSubs();
  if(subs[0]){out.push({icon:'🔁',text:`检测到疑似订阅:<b>${escapeHtml(subs[0].note)}</b>(${fmt(subs[0].amount)}),已出现 ${subs[0].count} 次。`});}
  if(!out.length)out.push({icon:'🌱',text:'多记几笔,AI 就能帮你发现消费规律。'});
  return out.slice(0,4);
}

  rec.kind=$('#txForm .seg button.active').textContent.includes('收入')?'inc':'exp';

async function applyBalance(rec,old){
  if(old){const oa=acctById(old.account);if(oa){oa.balance+=old.kind==='exp'?old.amount:-old.amount;await dbPut('accounts',oa);}}
  const na=acctById(rec.account);if(na){na.balance+=rec.kind==='exp'?-rec.amount:rec.amount;await dbPut('accounts',na);}
}
async function delTx(){
  if(!editingTx)return;
  const a=acctById(editingTx.account);if(a){a.balance+=editingTx.kind==='exp'?editingTx.amount:-editingTx.amount;await dbPut('accounts',a);}
  await dbDel('transactions',editingTx.id);await reload();closeModal('txModal');toast('已删除');render();
}

  const hasBudget=totalLimit>0;
  // 月总预算减去本月全部支出，得到真正可继续消费的额度。
  const remain=totalLimit-monthExp;
  const daysLeft=Math.max(0,daysInMonth-dayToday);
  const suggestPerDay=daysLeft>0?remain/daysLeft:0;
  const idealSpent=hasBudget?totalLimit*dayToday/daysInMonth:0;
  const paceGap=monthExp-idealSpent;
  // 分类占比(按一级)
  const byCat={};
  mt.filter(t=>t.kind==='exp').forEach(t=>{const top=topOf(t.category);if(top)byCat[top.id]=(byCat[top.id]||0)+t.amount;});
  const catArr=Object.entries(byCat).map(([id,v])=>({cat:catById(id),v})).filter(x=>x.cat).sort((a,b)=>b.v-a.v);

  $('#main').innerHTML=`

// 预算页图表:每日支出柱 + 分类饼 + 预算节奏
function renderBudgetCharts(ym,catArr,totalLimit,dayToday){
  if(!window.Chart)return;
  const css=getComputedStyle(document.body);
  const cText=css.getPropertyValue('--text-muted').trim(),cBorder=css.getPropertyValue('--border').trim();
  const cBrand=css.getPropertyValue('--brand').trim(),cDanger=css.getPropertyValue('--danger').trim();
  // 1) 本月每日支出
  const[y,m1]=ym.split('-').map(Number),daysInMonth=new Date(y,m1,0).getDate();
  const daily=Array(daysInMonth).fill(0);
  monthTx(ym).filter(t=>t.kind==='exp').forEach(t=>{const d=parseInt(t.date.slice(8,10),10);if(d>=1&&d<=daysInMonth)daily[d-1]+=t.amount;});
  charts.dailyBar=new Chart($('#dailyBar'),{
    type:'bar',
    data:{labels:daily.map((_,i)=>i+1),datasets:[{data:daily,backgroundColor:cDanger,borderRadius:3,barPercentage:.9,categoryPercentage:.9}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:it=>ym.slice(5)+'/'+it[0].label,label:it=>'支出 '+fmt(it.raw)}}},
      scales:{y:{ticks:{color:cText,maxTicksLimit:4},grid:{color:cBorder}},x:{ticks:{color:cText,maxTicksLimit:15,autoSkip:true},grid:{display:false}}}}
  });
  // 2) 分类饼
  if(catArr.length){
    charts.catPie=new Chart($('#catPie'),{
      type:'doughnut',
      data:{labels:catArr.map(x=>x.cat.name),datasets:[{data:catArr.map(x=>x.v),backgroundColor:catArr.map(x=>x.cat.color),borderWidth:0}]},
      options:{cutout:'66%',plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false}
    });
  }
  // 3) 累计实际支出 vs 理想预算进度
  let running=0;
  const historical=ym<curMonth();
  const cumulative=daily.map((v,i)=>{running+=v;return historical||i<dayToday?running:null;});
  const ideal=totalLimit?daily.map((_,i)=>totalLimit*(i+1)/daysInMonth):[];
  const datasets=[{label:'累计已花',data:cumulative,borderColor:cDanger,backgroundColor:cDanger+'18',tension:.25,fill:true,pointRadius:0,borderWidth:2}];
  if(totalLimit)datasets.push({label:'理想进度',data:ideal,borderColor:cBrand,backgroundColor:'transparent',tension:0,fill:false,pointRadius:0,borderWidth:2,borderDash:[5,5]});
  charts.budgetPace=new Chart($('#budgetPace'),{
    type:'line',
    data:{labels:daily.map((_,i)=>i+1),datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:cText,usePointStyle:true,boxWidth:7}}},
      scales:{y:{beginAtZero:true,ticks:{color:cText,maxTicksLimit:4},grid:{color:cBorder}},x:{ticks:{color:cText,maxTicksLimit:10,autoSkip:true},grid:{display:false}}}}
  });
}

// 加密 JSON 备份:整个 data 用主密码 AES-GCM 加密,离开本机也安全
async function exportEncrypted(){
  if(!cryptoKey){toast('未解锁,无法加密导出');return;}
  const plain=JSON.stringify({version:2,exportedAt:new Date().toISOString(),cfg:{currency:cfg.currency},data:DATA});
  const payload=await encField(plain);   // v1:iv:ct
  const file={moji:'encrypted-backup',salt:getVault()?.salt||'',cipher:payload,exportedAt:new Date().toISOString()};
  download('moji-加密备份-'+todayISO()+'.json',JSON.stringify(file,null,2),'application/json');
  toast('已导出加密备份');
}
function exportCSV(){
  const rows=[['日期','类型','一级分类','二级分类','金额','备注','标签']];
  DATA.tx.forEach(t=>rows.push([t.date,t.kind==='exp'?'支出':'收入',topOf(t.category)?.name||'',catName(t.category),t.amount,t.note||'',(t.tags||[]).join(' ')]));
  const csv='\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  download('moji-交易-'+todayISO()+'.csv',csv,'text/csv');toast('已导出 CSV');

function download(name,content,type){
  const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);
}
// 写入一份备份数据(明文对象)到本地库并同步
async function restoreData(d){
  if(!d||!d.tx){toast('文件格式不对');return;}
  for(const s of['transactions','accounts','categories','budgets','goals','rules'])await dbClear(s);
  for(const t of d.tx)await dbPut('transactions',t);
  for(const a of d.accounts)await dbPut('accounts',a);
  for(const c of d.categories)await dbPut('categories',c);
  for(const b of(d.budgets||[]))await dbPut('budgets',b);
  for(const g of(d.goals||[]))await dbPut('goals',g);
  for(const rr of(d.rules||[]))await dbPut('rules',rr);
  await reload();toast('恢复成功');render();
}
function importJSON(input){
  const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{
    try{
      const raw=JSON.parse(r.result);
      // 加密备份:需用当前主密码解密(必须同一密码)
      if(raw.moji==='encrypted-backup'){
        if(!cryptoKey){toast('请先解锁');return;}
        let plain;
        try{plain=await decField(raw.cipher);}
        catch(e){toast('解密失败:主密码与备份不一致');return;}
        await restoreData(JSON.parse(plain).data);
        return;
      }
      // 明文备份
      await restoreData(raw.data);
    }catch(e){toast('导入失败:'+e.message);}
  };
  r.readAsText(f);
}

/* ===================== AI 批次写入与撤销 ===================== */
const AI_UNDO_WINDOW_MS=5200;
const aiBatchSaves=new Map();
function newAIBatchId(){return crypto.randomUUID?crypto.randomUUID():uid();}
function aiSourceId(batchId,index){return `ai:${batchId}:${index}`;}
function saveAIBatch(items,{batchId,account=defaultAccount()}={}){
  if(!batchId||!account)return Promise.reject(new Error('AI 批次或账户无效'));
  if(aiBatchSaves.has(batchId))return aiBatchSaves.get(batchId);
  const pending=new Promise((resolve,reject)=>{
    let result={batchId,saved:[],skipped:0},failure=null;
    const idbTx=db.transaction(['transactions','accounts'],'readwrite');
    const txs=idbTx.objectStore('transactions'),accounts=idbTx.objectStore('accounts');
    idbTx.oncomplete=()=>{
      if(result.saved.length)queueSync();
      resolve(result);
    };
    idbTx.onabort=()=>reject(failure||idbTx.error||new Error('AI 批次写入失败'));
    const allReq=txs.getAll();
    allReq.onsuccess=()=>{
      const existing=new Set((allReq.result||[]).map(t=>t.sourceId).filter(Boolean));
      const now=Date.now();
      const records=items.map((it,index)=>({
        id:uid(),sourceId:aiSourceId(batchId,index),batchId,
        kind:it.kind,amount:normalizeAIAmount(it.amount),category:it.category,account,
        date:it.date,note:String(it.merchant||'').trim(),tags:['AI'],createdAt:now+index,
        updatedAt:now,_dirty:1
      })).filter(rec=>{
        if(existing.has(rec.sourceId)){result.skipped++;return false;}
        existing.add(rec.sourceId);return true;
      });
      result.saved=records;
      if(!records.length)return;
      const accountReq=accounts.get(account);
      accountReq.onsuccess=()=>{
        const current=accountReq.result;
        if(!current||current.deleted){
          failure=new Error('没有可用账户,请先创建账户');
          idbTx.abort();return;
        }
        const delta=records.reduce((sum,rec)=>sum+(rec.kind==='exp'?-rec.amount:rec.amount),0);
        current.balance=(Number(current.balance)||0)+delta;
        current.updatedAt=now;current._dirty=1;
        accounts.put(current);
        records.forEach(rec=>txs.put(rec));
      };
    };
  });
  const tracked=pending.finally(()=>aiBatchSaves.delete(batchId));
  aiBatchSaves.set(batchId,tracked);
  return tracked;
}
function undoAIBatch(batchId){
  return new Promise((resolve,reject)=>{
    let count=0;
    const idbTx=db.transaction(['transactions','accounts'],'readwrite');
    const txs=idbTx.objectStore('transactions'),accounts=idbTx.objectStore('accounts');
    idbTx.oncomplete=()=>{if(count)queueSync();resolve(count);};
    idbTx.onabort=()=>reject(idbTx.error||new Error('撤销失败'));
    const allReq=txs.getAll();
    allReq.onsuccess=()=>{
      const prefix=`ai:${batchId}:`,now=Date.now(),reversals=new Map();
      const records=(allReq.result||[]).filter(t=>!t.deleted&&(t.batchId===batchId||String(t.sourceId||'').startsWith(prefix)));
      count=records.length;
      records.forEach(rec=>{
        rec.deleted=1;rec.updatedAt=now;rec._dirty=1;txs.put(rec);
        const delta=rec.kind==='exp'?rec.amount:-rec.amount;
        reversals.set(rec.account,(reversals.get(rec.account)||0)+delta);
      });
      reversals.forEach((delta,accountId)=>{
        const req=accounts.get(accountId);
        req.onsuccess=()=>{
          const account=req.result;
          if(!account)return;
          account.balance=(Number(account.balance)||0)+delta;
          account.updatedAt=now;account._dirty=1;accounts.put(account);
        };
      });
    };
  });
}
function showAIBatchUndo(batchId,count){
  if(!count)return;
  toast(`已入账 ${count} 笔`,{
    duration:AI_UNDO_WINDOW_MS,
    actionLabel:'撤销',
    position:$('#launchCapture').classList.contains('open')?'top':'bottom',
    onAction:async()=>{
      const undone=await undoAIBatch(batchId);
      await reload();render();
      if($('#launchCapture').classList.contains('open')){
        launchFeedback(`<div class="card" style="padding:14px">已撤销 ${undone} 笔</div>`);
      }
      toast(undone?`已撤销 ${undone} 笔`:'这批记录已撤销');
    }
  });
}

// 从可能含代码块/推理过程的文本里稳健提取 JSON 对象
function extractJSON(txt){
  // 1) 优先匹配 ```json ... ``` 代码块
  const fence=txt.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const candidates=[];
  if(fence)candidates.push(fence[1]);
  // 2) 含 "items" 的对象优先
  const itemsMatch=txt.match(/\{[\s\S]*?"items"[\s\S]*\}/);
  if(itemsMatch)candidates.push(itemsMatch[0]);
  // 3) 最后一个大括号块(推理模型常把最终答案放最后)
  const all=[...txt.matchAll(/\{[\s\S]*?\}/g)].map(m=>m[0]);
  if(all.length)candidates.push(all[all.length-1],all[0]);
  for(const c of candidates){
    try{const o=JSON.parse(c);if(o&&typeof o==='object')return o;}catch(e){}
  }
  // 4) 贪婪抓取首尾大括号再试
  const s=txt.indexOf('{'),e=txt.lastIndexOf('}');
  if(s>=0&&e>s){try{return JSON.parse(txt.slice(s,e+1));}catch(e){}}
  return null;
}

  return [...new Set(issues)];

const LAUNCH_DRAFT_KEY='mojiLaunchDraftV1',LAUNCH_DRAFT_TTL=7*864e5;
let launchDraftWriteSeq=0,launchDraftReady=false,launchSending=false;
function setLaunchText(value,{persist=true}={}){
  const input=$('#launchText');
  if(input)input.value=value;
  if(persist)persistLaunchDraft(value);
}
function initLaunchDraftCapture(){
  const input=$('#launchText');
  if(!input||input.dataset.draftCapture==='1')return;
  input.dataset.draftCapture='1';
  input.addEventListener('input',()=>persistLaunchDraft(input.value,{userInitiated:true}));
  window.addEventListener('pagehide',()=>persistLaunchDraft(input.value));
  document.addEventListener('visibilitychange',()=>{if(document.hidden)persistLaunchDraft(input.value);});
}
async function persistLaunchDraft(value,{userInitiated=false}={}){
  if(!value&&!launchDraftReady&&!userInitiated)return;
  const seq=++launchDraftWriteSeq;
  if(!value){
    localStorage.removeItem(LAUNCH_DRAFT_KEY);
    return;
  }
  if(!cryptoKey)return;
  try{
    const now=Date.now(),cipher=await encField(value);
    if(seq!==launchDraftWriteSeq||$('#launchText')?.value!==value)return;
    localStorage.setItem(LAUNCH_DRAFT_KEY,JSON.stringify({version:1,cipher,updatedAt:now,expiresAt:now+LAUNCH_DRAFT_TTL}));
  }catch(e){}
}
async function restoreLaunchDraft(){
  const input=$('#launchText');
  if(!input||!cryptoKey)return;
  const earlyValue=input.value;
  let restored='';
  try{
    const stored=JSON.parse(localStorage.getItem(LAUNCH_DRAFT_KEY)||'null');
    if(stored){
      if(!stored.cipher||Date.now()>Number(stored.expiresAt)){
        localStorage.removeItem(LAUNCH_DRAFT_KEY);
      }else{
        restored=await decField(stored.cipher);
      }
    }
  }catch(e){
    localStorage.removeItem(LAUNCH_DRAFT_KEY);
  }
  const value=earlyValue||restored;
  input.value=value;
  launchDraftReady=true;
  if(earlyValue)await persistLaunchDraft(earlyValue);
}
function clearLaunchDraft(){
  launchDraftWriteSeq++;
  launchDraftReady=true;
  localStorage.removeItem(LAUNCH_DRAFT_KEY);
  const input=$('#launchText');if(input)input.value='';
}

// 调 OpenRouter 转写端点:先把录音解码重采样成 16kHz 单声道 WAV(小 ASR 模型识别率更高),再 base64 上传
async function transcribe(blob,ext){
  const wavB64=await blobToWavBase64(blob);
  const res=await fetch('/api/transcribe',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Moji-Pass':getPass()},
    body:JSON.stringify({model:cfg.asrModel,audio:wavB64})
  });
  if(!res.ok){
    let err;try{err=await res.json();}catch(e){}
    throw new Error(err?.error||`语音转写失败(${res.status})`);
  }
  const j=await res.json();
  return j.text||j.results?.[0]?.text||'';

// 任意录音格式 → 16kHz 单声道 16-bit PCM WAV → base64
async function blobToWavBase64(blob){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)throw new Error('当前浏览器不支持音频转换');
  const ac=new AC();
  let decoded;
  try{decoded=await ac.decodeAudioData(await blob.arrayBuffer());}
  catch(e){throw new Error('无法读取这段录音,请重录');}
  finally{try{await ac.close();}catch(e){}}
  if(!(decoded.duration>0))throw new Error('没录到声音,请再说一遍');
  if(decoded.duration>90)throw new Error('单次语音最长 90 秒,请分段录入');
  const outRate=16000;
  const frames=Math.ceil(decoded.duration*outRate);
  const chans=Array.from({length:decoded.numberOfChannels},(_,i)=>decoded.getChannelData(i));
  const bytesPerSample=2, dataLen=frames*bytesPerSample;
  const buf=new ArrayBuffer(44+dataLen), dv=new DataView(buf);
  const ws=(off,str)=>{for(let i=0;i<str.length;i++)dv.setUint8(off+i,str.charCodeAt(i));};
  ws(0,'RIFF');dv.setUint32(4,36+dataLen,true);ws(8,'WAVE');ws(12,'fmt ');
  dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);       // PCM, 单声道
  dv.setUint32(24,outRate,true);dv.setUint32(28,outRate*bytesPerSample,true);
  dv.setUint16(32,bytesPerSample,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,dataLen,true);
  // 线性重采样 + 多声道取平均
  const srcRate=decoded.sampleRate;
  const sampleAt=(arr,pos)=>{const i=Math.floor(pos),f=pos-i;const a=arr[i]||0,b=arr[i+1]!=null?arr[i+1]:a;return a+(b-a)*f;};
  for(let x=0;x<frames;x++){
    const pos=x*srcRate/outRate;
    let v=0;for(const ch of chans)v+=sampleAt(ch,pos);
    v/=chans.length;v=Math.max(-1,Math.min(1,v));
    dv.setInt16(44+x*2,v<0?v*32768:v*32767,true);
  }
  // ArrayBuffer → base64
  const bytes=new Uint8Array(buf);let bin='';
  for(let i=0;i<bytes.length;i+=32768)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+32768));
  return btoa(bin);
}

// 文本拆账(语音转写后 / 手动输入)
async function callTextParse(text){
  const prompt='你是私人记账助手,把用户明确发生的消费/收入拆成结构化账目。'+ACCOUNT_PROMPT()+`\n用户说:「${text}」`;
  const body={model:cfg.model,messages:[{role:'user',content:prompt}],temperature:0,max_tokens:3000,response_format:{type:'json_object'}};
  return parseAccountJSON(await callOR(body),{sourceText:text,requireExplicitCertainty:true});
}
// 统一 OpenRouter 调用,返回合并后的文本
async function callOR(body){
  // 走后端代理 /api/ai,Key 存 Cloudflare 环境变量,前端只带密码
  const res=await fetch('/api/ai',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Moji-Pass':getPass()},
    body:JSON.stringify(body)
  });
  if(!res.ok)throw new Error('HTTP '+res.status+' '+(await res.text()).slice(0,120));
  const j=await res.json();
  const msg=j.choices?.[0]?.message||{};
  const txt=(msg.content||'')+'\n'+(msg.reasoning||'');
  if(!txt.trim())throw new Error('模型无返回');
  return txt;
}
/* ===================== 智能分类规则 =====================
   规则:{id, keyword, category(二级id)}。新建交易时,若商家/备注含 keyword,自动套用分类。
   命中规则 > AI 判断(用户显式规则优先级最高)。 */
function matchRule(text){
  if(!text)return null;
  const s=String(text).toLowerCase();
  for(const r of DATA.rules){
    if(r.keyword&&s.includes(String(r.keyword).toLowerCase())){
      const c=catById(r.category);
      if(c)return c;   // 返回命中的二级分类
    }
  }
  return null;
}
function normalizeAIAmount(value){
  const amount=String(value??'').trim().replace(/,/g,'');
  return /^\d{1,10}(\.\d{1,2})?$/.test(amount)&&Number(amount)>0?Number(amount):'';
}
function normalizeAIConfidence(value){
  if(typeof value==='number')return value>=.8?'high':value>=.6?'medium':'low';
  return ['high','medium','low'].includes(value)?value:'low';
}
const BROAD_MERCHANT_RE=/^(迪卡侬|沃尔玛|京东|淘宝|天猫|拼多多|亚马逊|盒马|大型超市|超市|便利店|百货|商场)$/u;
function isBareBroadMerchant(sourceText,merchant){
  const name=String(merchant||'').trim();
  if(!BROAD_MERCHANT_RE.test(name)||!sourceText)return false;
  return String(sourceText).split(/[，,；;。\n]/).some(part=>{
    const text=part.trim().replace(/^(今天|昨天|前天|刚刚)/u,'').trim();
    if(!text.includes(name))return false;
    const remainder=text.replace(name,'')
      .replace(/(花了|花费|消费|买了|支付|付款)/gu,'')
      .replace(/[¥￥$]?\s*\d+(?:\.\d{1,2})?\s*(元|块钱?|人民币)?/gu,'')
      .replace(/[零一二三四五六七八九十百千万两点]+\s*(元|块钱?|人民币)?/gu,'')
      .replace(/[\s。.!！]/g,'');
    return !remainder;
  });
}
function resolveAILeaf(it,kind){
  if(!kind)return null;
  const categoryId=String(it.categoryId||'');
  const byId=catById(categoryId);
  if(byId?.parent&&byId.kind===kind)return byId;
  const categoryName=String(it.category||'').trim();
  return leafCats(kind).find(c=>c.name===categoryName||catFull(c.id)===categoryName)||null;
}
// 把模型返回规范成可编辑草稿:用户规则优先,分类与金额失败时保留条目但禁止自动入账。
function parseAccountJSON(txt,{sourceText='',requireExplicitCertainty=false}={}){
  const parsed=extractJSON(txt);
  if(!parsed)throw new Error('未能解析出账目,再说一遍或换种说法');
  const rawItems=Array.isArray(parsed.items)?parsed.items:(parsed.amount!=null?[parsed]:[]);
  if(!rawItems.length||rawItems.length>30)throw new Error('未识别到有效账目,或一次超过 30 笔,请分段录入');
  return rawItems.map((it,index)=>{
    const rawKind=String(it.kind||'');
    const kind=['inc','income'].includes(rawKind)?'inc':['exp','expense'].includes(rawKind)?'exp':'';
    const merchant=String(it.merchant||it.note||'').trim().slice(0,80);
    const ruled=kind?matchRule(merchant):null;
    const inferred=resolveAILeaf(it,kind);
    const leaf=ruled&&ruled.kind===kind?ruled:inferred;
    const confidence=normalizeAIConfidence(it.confidence);
    const explicitCertain=it.categoryStatus==='certain'&&confidence==='high';
    const broadMerchant=!(ruled&&ruled.kind===kind)&&isBareBroadMerchant(sourceText,merchant);
    const categoryStatus=ruled&&ruled.kind===kind?'certain'
      :leaf&&(!requireExplicitCertainty||explicitCertain)&&!broadMerchant?'certain':'uncertain';
    const categoryChoices=[...new Set(Array.isArray(it.categoryChoices)?it.categoryChoices.map(String):[])]
      .map(id=>catById(id))
      .filter(c=>c?.parent&&c.kind===kind)
      .slice(0,3)
      .map(c=>({id:c.id,name:catFull(c.id)}));
    const question=categoryStatus==='certain'?''
      :broadMerchant?`「${merchant}」具体买了什么？`
      :String(it.question||'').trim().slice(0,180)||(!leaf?'请选择这笔账目的分类':'请确认这笔账目的分类');
    return {
      amount:normalizeAIAmount(it.amount),
      merchant,
      date:/^\d{4}-\d{2}-\d{2}$/.test(it.date)?it.date:todayISO(),
      kind,category:leaf?.id||'',ruled:!!(ruled&&ruled.kind===kind),
      confidence:ruled&&ruled.kind===kind?'high':confidence,
      categoryStatus,categoryChoices,question,sourceIndex:index
    };
  });
}
/* ===================== 模态/主题/菜单 ===================== */
function openModal(id){$('#'+id).classList.add('open');}
function closeModal(id){
  if(id==='aiModal')stopRecord();
  $('#'+id).classList.remove('open');
  if(id==='aiModal'&&aiReturnToLaunch){
    const draft=aiLaunchDraft;
    aiReturnToLaunch=false;aiLaunchDraft='';
    openLaunch();
    if(draft)setLaunchText(draft);
  }
}
$$('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id);}));
function toggleTheme(){cfg.theme=cfg.theme==='dark'?'light':'dark';applyTheme();saveCfg();}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',cfg.theme);
  $('#themeLabel').textContent=cfg.theme==='dark'?'浅色模式':'深色模式';
  if(['budget','dashboard'].includes(curRoute))render();
}
function toggleMenu(force){
  const sb=$('#sidebar'),sc=$('#scrim');
  const open=force!==undefined?force:!sb.classList.contains('open');
  sb.classList.toggle('open',open);sc.classList.toggle('open',open);
}

/* ===================== 密码门(端到端加密) =====================
   两把独立的钥匙,职责分离:
   1) 门禁码 APP_PASS(常量,发给后端校验接口权限)—— 服务器知道,只防陌生人滥用接口。
   2) 主密码 → PBKDF2 → AES 钥匙(永不离开浏览器)—— 真正保护数据。服务器拿不到。
   校验块:用钥匙加密已知串 CHECK_TEXT 存本地+云,换设备时据此判断密码对不对。 */
const APP_PASS='7564';                 // 后端接口门禁(非数据钥匙),随请求头发送
const CHECK_TEXT='moji-vault-ok';      // 密码校验用的已知明文
function getPass(){return APP_PASS;}   // 兼容旧调用:后端校验仍用它
function getVault(){return JSON.parse(localStorage.getItem('mojiVault')||'null');}  // {salt,check}
function setVault(v){localStorage.setItem('mojiVault',JSON.stringify(v));}
// 本机记住钥匙(默认30天):导出 raw key + 到期时间戳,存 localStorage
async function rememberKey(key){
  const raw=await crypto.subtle.exportKey('raw',key);
  localStorage.setItem('mojiKey',JSON.stringify({k:b64e(raw),exp:Date.now()+30*864e5}));
}
async function loadRememberedKey(){
  const r=JSON.parse(localStorage.getItem('mojiKey')||'null');
  if(!r||Date.now()>r.exp){localStorage.removeItem('mojiKey');return null;}
  try{return await crypto.subtle.importKey('raw',b64d(r.k),{name:'AES-GCM'},true,['encrypt','decrypt']);}
  catch(e){return null;}
}
function lockOut(){localStorage.removeItem('mojiKey');cryptoKey=null;location.reload();}
// 云端是否已有加密账本(换设备时据此决定"创建"还是"解锁")
async function fetchCloudVault(){
  try{
    const res=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json','X-Moji-Pass':getPass()},body:JSON.stringify({since:0,changes:[]})});
    if(!res.ok)return null;
    const out=await res.json();
    const m=(out.records||[]).find(r=>r.store==='meta'&&r.id==='__vault__');
    return m?JSON.parse(m.data):null;   // meta 的 data 不加密,存 {salt,check}
  }catch(e){return null;}
}
// 启动门禁:记住钥匙→直接进;否则按"有无账本"显示创建/解锁
async function gate(){
  cryptoKey=await loadRememberedKey();
  if(cryptoKey){await restoreLaunchDraft();await boot();return;}
  // 没记住钥匙:取本地或云端的 vault 决定模式
  document.documentElement.dataset.startupLocked='1';
  let vault=getVault();
  const ls=$('#lockScreen');ls.style.display='grid';
  const inp=$('#lockInput'),inp2=$('#lockInput2'),err=$('#lockErr'),btn=$('#lockBtn'),
        sub=$('#lockSub'),hint=$('#lockHint'),rememberWrap=$('#rememberWrap');
  if(!vault){
    hint.textContent='正在检查云端账本…';
    vault=await fetchCloudVault();
    if(vault)setVault(vault);
  }
  const creating=!vault;   // 无 vault = 首次创建
  sub.textContent=creating?'设置主密码(至少 8 位,用于加密你的账本)':'输入主密码解锁';
  inp2.style.display=creating?'block':'none';
  hint.innerHTML=creating
    ?'🔐 主密码是你账本的唯一钥匙,服务器也无法读取或找回。<b>请牢记,忘记将无法恢复数据。</b>'
    :'🔐 用创建账本时的主密码解锁。本设备不保存密码本身。';
  setTimeout(()=>inp.focus(),100);
  const submit=async()=>{
    const p=inp.value;
    if(creating){
      if(p.length<8){err.textContent='主密码至少 8 位';return;}
      if(p!==inp2.value){err.textContent='两次输入不一致';return;}
      const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));
      cryptoKey=await deriveKey(p,salt);
      const check=await encField(CHECK_TEXT);
      const v={salt,check};setVault(v);
      await persistVaultToCloud(v);
    }else{
      try{
        const k=await deriveKey(p,vault.salt);
        cryptoKey=k;
        const dec=await decField(vault.check);   // 用这把钥匙解校验块
        if(dec!==CHECK_TEXT){cryptoKey=null;err.textContent='主密码错误';inp.value='';inp.focus();return;}
      }catch(e){cryptoKey=null;err.textContent='主密码错误';inp.value='';inp.focus();return;}
    }
    if($('#lockRemember').checked)await rememberKey(cryptoKey);
    await restoreLaunchDraft();
    ls.style.display='none';await boot();
  };
  btn.onclick=submit;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){creating?inp2.focus():submit();}});
  inp2.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
}
// 把 vault(salt+check)写入云端 meta,供换设备校验同一密码
async function persistVaultToCloud(v){
  try{
    await openDB();
    await dbPut('meta',{id:'__vault__',salt:v.salt,check:v.check});
  }catch(e){}
}

/* ===================== 启动 ===================== */
async function boot(){
  await openDB();
  await reload();
  let existing=(await dbAll('accounts')).filter(x=>!x.deleted);
  // 本地为空:可能是换了新设备 —— 先尝试从云端拉取,避免重复播种
  if(!existing.length&&navigator.onLine){
    try{await pullInitial();}catch(e){}
    await reload();
    existing=(await dbAll('accounts')).filter(x=>!x.deleted);
  }
  // 云端也空 = 真·首次使用 —— 播种(会自动标脏并推送到云端)
  if(!existing.length)await seedAll();
  await reload();
  const h=location.hash.slice(1);
  if(h&&ROUTES.some(r=>r[0]===h))curRoute=h;
  applyTheme();
  renderNav();
  render();
  if(cfg.launchCapture)openLaunch();   // 开屏记账:打开直接进记账页
  document.documentElement.dataset.booted='1';
  delete document.documentElement.dataset.startupLocked;
  delete document.documentElement.dataset.startupLaunch;
  // 启动后台增量同步 + 网络恢复/回到前台自动同步
  setTimeout(syncNow,800);
  window.addEventListener('online',syncNow);
  window.addEventListener('offline',()=>setSyncStatus('offline'));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow();});
}
setupPWA();
initLaunchDraftCapture();
gate();  // 入口:先过密码门,再 boot
// 首次拉取:只把云端数据写入本地,不触发渲染(此时 UI 尚未就绪)
async function pullInitial(){
  const meta=syncMeta();
  const res=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json','X-Moji-Pass':getPass()},body:JSON.stringify({since:meta.since,changes:[]})});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const out=await res.json();
  await applyRemote(out.records||[]);
  setSyncMeta({since:out.now});
}

/* ===================== PWA ===================== */
function setupPWA(){
  if(!("serviceWorker"in navigator))return;
  if(location.protocol!=="https:"&&location.hostname!=="localhost"&&location.hostname!=="127.0.0.1")return;
  navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(reg=>reg.update()).catch(()=>{});
}
